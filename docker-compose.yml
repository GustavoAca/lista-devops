version: '3.8'

services:
  # -----------------------
  # Banco de dados Postgres
  # -----------------------
  postgres-api:
    build: ./postgres
    environment:
      POSTGRES_USER: glaiss
      POSTGRES_PASSWORD: PPgg123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices
    restart: always
    expose:
      - "5432"
    ports:
      - "5432:5432"

  # -----------------------
  # Redis (opcional se usado)
  # -----------------------
  redis:
    image: redis:7
    container_name: redis
    networks:
      - microservices
    restart: always
    expose:
      - "6379"

