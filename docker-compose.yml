version: '3.8'

services:
  postgres-api:
    container_name: postgres-api
    build: ./postgres
    environment:
      POSTGRES_USER: glaiss
      POSTGRES_PASSWORD: PPgg123
    expose:
      - "5432"
    ports:
      - "5432:5432"
    networks:
      - microservices
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:latest
    container_name: redis
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - ./.data/duducp/RedisData:/data
    networks:
      - microservices
    mem_limit: 512m
    cpus: 0.5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - ELASTICSEARCH_PASSWORD=password
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - microservices

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.2
    container_name: logstash
    depends_on:
      - elasticsearch
    ports:
      - "5000:5000"
      - "9600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    networks:
      - microservices

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_HOST: "http://elasticsearch:9200"
    networks:
      - microservices

  discovery:
    image: gacacio/discovery:0.10.0
    container_name: discovery
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8761
    ports:
      - "8761:8761"
    networks:
      - microservices
    mem_limit: 512m
    cpus: 0.5

  gateway:
    image: gacacio/gateway:0.18.0
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      URL_DISCOVERY: "http://discovery:8761/discovery/eureka"
      PORT: 8080
      LOGSTASH: logstash:5000
      CHAVE_API_KEY: chave-api-gateway
      SERVICO-FRONTEND: http://localhost:4200
      EUREKA_INSTANCE_HOSTNAME: localhost
      EUREKA_INSTANCE_NON_SECURE_PORT: 8080
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: false
    ports:
      - "8192:8080"
    networks:
      - microservices
    depends_on:
      - postgres-api
      - redis
      - elasticsearch
      - kibana
      - logstash
      - discovery
    mem_limit: 512m
    cpus: 0.5

