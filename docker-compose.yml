  # -----------------------
  # Serviço Lista
  # -----------------------
  lista:
    image: gacacio/lista:0.26.0
    container_name: lista
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:postgresql://postgres:5432/glaiss?TimeZone=America/Sao_Paulo"
      USER_DB: "gl_lista"
      PASSWORD_DB: "gl_lista"
    networks:
      - microservices
    restart: always
    expose:
      - "8080"

  # -----------------------
  # Serviço Notification
  # -----------------------
  notification:
    image: gacacio/notification:0.10.1
    container_name: notification
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:postgresql://postgres:5432/glaiss?TimeZone=America/Sao_Paulo"
      USER_DB: "gl_notification"
      PASSWORD_DB: "gl_notification"
